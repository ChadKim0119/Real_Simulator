<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070a10">
  <title>Control Panel</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/control.css">
</head>
<body>
  <header>
    <b>e-Care 시연 컨트롤</b>
    <span id="link">● 연결 확인 중</span>
    <span id="veh"></span>
    <span id="toast"></span>
  </header>
  <aside id="dock" aria-label="시선 · 초기화 (항상 고정)">
    <b>시선</b>
    <button data-cam="auto">자동</button>
    <button data-cam="full">전체</button>
    <button data-cam="cluster">계기판<span> 확대</span></button>
    <button data-cam="hu">HU<span> 확대</span></button>
    <hr>
    <button data-reset class="warn">초기화</button>
  </aside>
  <main>
    <section class="col run">
      <div id="now"></div>
      <div id="steps"></div>
    </section>
    <section class="col scen">
      <h2>시나리오</h2>
      <div id="scenarios"></div>
    </section>
    <section class="col side">
      <div id="manual"></div>
    </section>
  </main>
  <script src="js/link.js"></script>
  <script src="js/ecare.js"></script>
  <script src="js/control.js"></script>
</body>
</html>
