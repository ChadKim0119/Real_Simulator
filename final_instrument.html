<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03060b">
  <title>Final Instrument · e-Care 시연</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/final-instrument.svg">
  <link rel="apple-touch-icon" href="assets/icons/final-instrument-180.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/final.css">
  <link rel="stylesheet" href="css/follow.css">
</head>
<body class="fi">
  <!-- 21:9 screen 1: the customer's car (cluster + head unit) and the conversation -->
  <div id="canvas">
    <iframe id="car" src="index.html?stage=1&amp;hu=1" title="고객 차량 · 계기판 · 헤드유닛" allow="autoplay; fullscreen"></iframe>
    <div id="link" aria-live="polite"><i></i><span></span></div>
    <div id="journey" aria-live="polite"><i class="num">1</i><b></b><em></em><span class="dots"></span></div>
    <aside id="talk" aria-label="상담 대화">
      <header>
        <span class="av2"><img src="assets/avatar_agent.webp" alt="e-Care 상담원"><img src="assets/avatar_customer.webp" alt="고객"></span>
        <b>상담 대화</b>
        <span class="st"><em id="talkState">대기</em><span id="talkTime" class="num"></span></span>
        <button id="talkMin" class="min" title="줄이기 (T)" aria-label="상담 대화 줄이기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l6 6 6-6M12 20V4"/></svg></button>
        <small id="talkSub">e-Care 고객지원실 · 고객</small>
      </header>
      <iframe id="talkFrame" src="ccw.html?view=transcript&amp;stage=1&amp;bare=1&amp;voice=1" title="상담 대화" allow="autoplay"></iframe>
      <div class="wave" aria-hidden="true"></div>
    </aside>
    <button id="fab" title="상담 대화 열기 · 닫기"><svg viewBox="0 0 24 24" fill="none" stroke="#03140b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11h7M8.5 14.5h4.5"/></svg><span>상담 대화</span><em class="badge num"></em></button>
  </div>
  <script src="assets/vendor/gsap/gsap.min.js"></script>
  <script src="assets/vendor/gsap/MotionPathPlugin.min.js"></script>
  <script src="assets/vendor/gsap/DrawSVGPlugin.min.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/link.js"></script>
  <script src="js/ecare.js"></script>
  <script src="js/follow.js"></script>
  <script src="js/final-common.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/final-instrument.js"></script>
  <script src="js/launch.js"></script>
</body>
</html>
